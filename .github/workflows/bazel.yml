name: bazel-spike
on:
  pull_request:
    paths:
      - 'MODULE.bazel'
      - '.bazelrc'
      - 'tools/bazel/**'
      - 'hadoop-hdds/**/BUILD.bazel'
      - 'hadoop-ozone/**/BUILD.bazel'
      - '.github/workflows/bazel.yml'
  push:
    branches:
      - master
    paths:
      - 'MODULE.bazel'
      - '.bazelrc'
      - 'tools/bazel/**'

permissions: {}

jobs:
  bazel-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Bazel verify (tests + default graph)
        run: ./tools/bazel/verify_build.sh
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-testlogs
          path: bazel-testlogs/**
