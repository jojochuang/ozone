name: nfs-native
on:
  pull_request:
    paths:
      - '.github/workflows/nfs-native.yml'
      - '.mvn/extensions.xml'
      - 'hadoop-hdds/common/**'
      - 'hadoop-ozone/client/**'
      - 'hadoop-ozone/common/**'
      - 'hadoop-ozone/dist/**'
      - 'hadoop-ozone/interface-client/**'
      - 'hadoop-ozone/interface-storage/**'
      - 'hadoop-ozone/ozone-manager/**'
      - 'hadoop-ozone/s3gateway/**'
      - 'hadoop-ozone/nfs-gateway/**'
      - 'hadoop-ozone/integration-test/**'
      - 'hadoop-ozone/pom.xml'
      - 'pom.xml'
  push:
    paths:
      - '.github/workflows/nfs-native.yml'
      - '.mvn/extensions.xml'
      - 'hadoop-hdds/common/**'
      - 'hadoop-ozone/client/**'
      - 'hadoop-ozone/common/**'
      - 'hadoop-ozone/dist/**'
      - 'hadoop-ozone/interface-client/**'
      - 'hadoop-ozone/interface-storage/**'
      - 'hadoop-ozone/ozone-manager/**'
      - 'hadoop-ozone/s3gateway/**'
      - 'hadoop-ozone/nfs-gateway/**'
      - 'hadoop-ozone/integration-test/**'
      - 'hadoop-ozone/pom.xml'
      - 'pom.xml'
  workflow_dispatch:

permissions: { }

jobs:
  linux-native:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Java gateway and contract fixture
        run: |
          mvn --version
          mvn --batch-mode --settings dev-support/ci/maven-settings.xml \
            -Ddevelocity.enabled=false \
            -pl :ozone-nfs-gateway -am install -DskipTests -DskipShade -DskipRecon -DskipDocs

      - name: Run NFS gateway unit tests
        run: >-
          mvn --batch-mode --settings dev-support/ci/maven-settings.xml
          -Ddevelocity.enabled=false -pl :ozone-nfs-gateway test -DskipShade -DskipRecon -DskipDocs

      - name: Set short hostname for secure MiniOzoneCluster certificates
        run: |
          sudo hostname ozone-ci
          echo "127.0.0.1 ozone-ci" | sudo tee -a /etc/hosts
          test "$(hostname)" = ozone-ci

      - name: Run secure NFS gateway integration test
        run: >-
          mvn --batch-mode --settings dev-support/ci/maven-settings.xml
          -Ddevelocity.enabled=false
          -pl :ozone-integration-test -am
          -Dtest=TestNfsCallerAuthorizationSecure,TestNfsGatewayKerberosRenewal -DfailIfNoTests=false
          -Dmaven-surefire-plugin.argLineAccessArgs="--add-opens=java.base/java.lang=ALL-UNNAMED"
          verify -DskipShade -DskipRecon -DskipDocs

      - name: Run NFS FSO identity and readiness contract
        run: >-
          mvn --batch-mode --settings dev-support/ci/maven-settings.xml
          -Ddevelocity.enabled=false
          -pl :ozone-integration-test -am
          -Dtest=TestOzoneIntegrationNonHA -Dgroups=nfs
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dmaven-surefire-plugin.argLineAccessArgs="--add-opens=java.base/java.lang=ALL-UNNAMED"
          verify -DskipShade -DskipRecon -DskipDocs

      - name: Build distribution and verify NFS gateway packaging
        run: |
          mvn --batch-mode --settings dev-support/ci/maven-settings.xml \
            -Ddevelocity.enabled=false -pl :ozone-dist -am -Pdist \
            -DskipTests -DskipShade -DskipRecon -DskipDocs package
          python3 hadoop-ozone/nfs-gateway/src/test/nfs/test_distribution.py \
            hadoop-ozone/dist/target/ozone-*-SNAPSHOT

      - name: Copy Java contract dependencies
        run: >-
          mvn --batch-mode --settings dev-support/ci/maven-settings.xml
          -Ddevelocity.enabled=false
          -pl :ozone-nfs-gateway dependency:copy-dependencies -DincludeScope=test
          -DskipShade -DskipRecon -DskipDocs

      - name: Build and test native file handles
        run: |
          cmake -S hadoop-ozone/nfs-gateway -B target/nfs-native \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build target/nfs-native --parallel 2
          ctest --test-dir target/nfs-native --output-on-failure

      - name: Build and run C++ to Java mutual-TLS contract
        run: |
          docker build \
            -f hadoop-ozone/nfs-gateway/src/test/native/Dockerfile.grpc \
            -t ozone-nfs-grpc:ci hadoop-ozone/nfs-gateway
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            ozone-nfs-grpc:ci sh -c '
              cmake -S /workspace/hadoop-ozone/nfs-gateway -B /tmp/nfs-build \
                -DOZONE_NFS_GRPC=ON -DCMAKE_BUILD_TYPE=Release &&
              cmake --build /tmp/nfs-build --parallel 2 &&
              ctest --test-dir /tmp/nfs-build --output-on-failure &&
              classpath="/workspace/hadoop-ozone/nfs-gateway/target/classes" &&
              classpath="$classpath:/workspace/hadoop-ozone/nfs-gateway/target/test-classes" &&
              classpath="$classpath:/workspace/hadoop-ozone/interface-client/target/classes" &&
              classpath="$classpath:/workspace/hadoop-ozone/common/target/classes" &&
              classpath="$classpath:/workspace/hadoop-ozone/nfs-gateway/target/dependency/*" &&
              python3 /workspace/hadoop-ozone/nfs-gateway/src/test/native/test_grpc_tls.py \
                --java-classpath "$classpath" \
                --native-client /tmp/nfs-build/test_ozone_grpc_tls -v
            '

      - name: Test mounted NFS contract runner suites
        run: |
          python3 hadoop-ozone/nfs-gateway/src/test/nfs/test_ganesha_ozone_runner.py
          python3 hadoop-ozone/nfs-gateway/src/test/nfs/test_ganesha_restart_acceptance_runner.py
          python3 hadoop-ozone/nfs-gateway/src/test/nfs/test_ganesha_reclaim_runner.py
          python3 hadoop-ozone/nfs-gateway/src/test/nfs/test_benchmark_ganesha_ozone.py

      - name: Build pinned Ganesha V5.7 with FSAL_OZONE
        run: |
          docker build \
            -f hadoop-ozone/nfs-gateway/src/main/ganesha/Dockerfile \
            -t ozone-nfs-ganesha:ci hadoop-ozone
          docker run --rm ozone-nfs-ganesha:ci ganesha.nfsd -v

      - name: Start FSAL_OZONE export and verify mutual-TLS handshake
        run: |
          classpath="hadoop-ozone/nfs-gateway/target/classes"
          classpath="$classpath:hadoop-ozone/nfs-gateway/target/test-classes"
          classpath="$classpath:hadoop-ozone/interface-client/target/classes"
          classpath="$classpath:hadoop-ozone/common/target/classes"
          classpath="$classpath:hadoop-ozone/nfs-gateway/target/dependency/*"
          python3 hadoop-ozone/nfs-gateway/src/test/native/test_grpc_tls.py \
            --java-classpath "$classpath" \
            --native-client unused \
            --ganesha-image ozone-nfs-ganesha:ci \
            GrpcTlsContract.test_ganesha_loads_ozone_export_and_completes_capability_handshake

      - name: Mount FSAL_OZONE with NFSv4.1 Kerberos privacy
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            krb5-admin-server krb5-kdc krb5-user nfs-common
          sudo tee /etc/krb5.conf >/dev/null <<'EOF'
          [libdefaults]
            default_realm = EXAMPLE.COM
            dns_canonicalize_hostname = false
            dns_lookup_realm = false
            rdns = false
          [realms]
            EXAMPLE.COM = {
              kdc = 127.0.0.1:88
            }
          EOF
          sudo tee /etc/krb5kdc/kdc.conf >/dev/null <<'EOF'
          [kdcdefaults]
            kdc_ports = 88
          [realms]
            EXAMPLE.COM = {
              database_name = /var/lib/krb5kdc/principal
              key_stash_file = /etc/krb5kdc/stash
              acl_file = /etc/krb5kdc/kadm5.acl
              max_life = 24h
              max_renewable_life = 7d
            }
          EOF
          sudo kdb5_util create -s -P ozone-nfs-ci-master
          sudo kadmin.local -q 'addprinc -pw alice alice@EXAMPLE.COM'
          sudo kadmin.local -q 'addprinc -randkey nfs/localhost@EXAMPLE.COM'
          sudo kadmin.local -q 'addprinc -randkey nfs/ozone-ci@EXAMPLE.COM'
          sudo kadmin.local -q 'addprinc -randkey host/localhost@EXAMPLE.COM'
          sudo kadmin.local -q 'addprinc -randkey host/ozone-ci@EXAMPLE.COM'
          sudo kadmin.local -q 'ktadd -k /tmp/ozone-nfs.keytab nfs/localhost@EXAMPLE.COM nfs/ozone-ci@EXAMPLE.COM host/localhost@EXAMPLE.COM host/ozone-ci@EXAMPLE.COM'
          sudo chmod 644 /tmp/ozone-nfs.keytab
          sudo krb5kdc -n >/tmp/ozone-nfs-kdc.log 2>&1 &
          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 88; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 88
          sudo mkdir -p /run/rpc_pipefs
          sudo mountpoint -q /run/rpc_pipefs || \
            sudo mount -t rpc_pipefs rpc_pipefs /run/rpc_pipefs
          sudo install -m 600 /tmp/ozone-nfs.keytab /etc/krb5.keytab
          sudo rpc.gssd -f >/tmp/ozone-nfs-rpc-gssd.log 2>&1 &
          for attempt in $(seq 1 30); do
            if pgrep -x rpc.gssd >/dev/null; then break; fi
            sleep 1
          done
          pgrep -x rpc.gssd >/dev/null
          sudo sh -c 'printf "alice\n" | KRB5CCNAME=FILE:/tmp/krb5cc_0 kinit -c FILE:/tmp/krb5cc_0 alice'
          classpath="hadoop-ozone/nfs-gateway/target/classes"
          classpath="$classpath:hadoop-ozone/nfs-gateway/target/test-classes"
          classpath="$classpath:hadoop-ozone/interface-client/target/classes"
          classpath="$classpath:hadoop-ozone/common/target/classes"
          classpath="$classpath:hadoop-ozone/nfs-gateway/target/dependency/*"
          sudo env KRB5CCNAME=FILE:/tmp/krb5cc_0 python3 \
            hadoop-ozone/nfs-gateway/src/test/native/test_grpc_tls.py \
            --java-classpath "$classpath" \
            --native-client unused \
            --ganesha-image ozone-nfs-ganesha:ci \
            --ganesha-keytab /tmp/ozone-nfs.keytab \
            --mount-contract /tmp/ozone-nfs-mount \
            GrpcTlsContract.test_ganesha_loads_ozone_export_and_completes_capability_handshake
