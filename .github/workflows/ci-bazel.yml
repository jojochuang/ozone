name: ci-bazel

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bazel-verify:
    name: bazel verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Python deps for Bazel generators
        run: pip install defusedxml
      - name: Install Bazelisk
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Bazel verify (tests + default graph)
        run: ./tools/bazel/verify_build.sh
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-testlogs
          path: bazel-testlogs/**

  basic:
    name: basic (${{ matrix.check }})
    needs: bazel-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check:
          - author
          - bats
          - bazel
          - rat
          - checkstyle
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ matrix.check != 'bats' && 1 || 0 }}
          persist-credentials: false
      - name: Set up JDK 21
        if: matrix.check == 'checkstyle' || matrix.check == 'rat'
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python deps
        if: matrix.check == 'bazel'
        run: pip install defusedxml
      - name: Install Bazelisk
        if: matrix.check == 'bazel'
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Run check
        run: hadoop-ozone/dev-support/checks/${{ matrix.check }}.sh

  bazel-milestones:
    name: bazel milestones
    needs: bazel-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: pip install defusedxml
      - name: Install Bazelisk
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Extended compile milestones
        run: ./tools/bazel/verify_extended.sh

  bazel-dist:
    name: bazel dist layout
    needs: bazel-milestones
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: pip install defusedxml
      - name: Install Bazelisk
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Stage Maven-style dist directory
        run: chmod +x tools/bazel/stage_dist_layout.sh && ./tools/bazel/stage_dist_layout.sh

  parity-static:
    name: parity static (${{ matrix.check }})
    needs: bazel-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        check:
          - findbugs_bazel
          - pmd
          - license
          - javadoc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Bazelisk
        if: matrix.check == 'findbugs_bazel'
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Run check
        run: |
          if [[ "${{ matrix.check }}" == findbugs_bazel ]]; then
            chmod +x tools/bazel/checks/findbugs_bazel.sh
            ./tools/bazel/checks/findbugs_bazel.sh
          else
            hadoop-ozone/dev-support/checks/${{ matrix.check }}.sh
          fi

  parity-integration:
    name: parity integration (compile)
    needs: bazel-milestones
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: pip install defusedxml
      - name: Install Bazelisk
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Integration classpath (Bazel)
        run: chmod +x tools/bazel/checks/integration_bazel.sh && ./tools/bazel/checks/integration_bazel.sh

  acceptance-smoke:
    name: acceptance smoke
    needs: bazel-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: pip install defusedxml
      - name: Install Bazelisk
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Stage dist
        run: ./tools/bazel/stage_dist_layout.sh
      - name: Run smoke acceptance suite
        env:
          OZONE_ACCEPTANCE_SUITE: smoketest
        run: hadoop-ozone/dev-support/checks/acceptance.sh smoketest

  recon-ui:
    name: recon npm ui
    needs: bazel-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build Recon web UI
        run: chmod +x tools/bazel/recon_npm_build.sh && ./tools/bazel/recon_npm_build.sh
